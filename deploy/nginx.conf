# Every BorNiz host points at the same app (deploy/borniz.service on 127.0.0.1:3000).
# Replace bornis.id with NEXT_PUBLIC_BORNIZ_ROOT_DOMAIN; certificates: certbot --nginx -d bornis.id -d app.bornis.id …
# DNS: an A record for each name below to this server (`npm run check:deploy` lists them).
upstream borniz { server 127.0.0.1:3000; keepalive 32; }

server {
  listen 80;
  server_name bornis.id www.bornis.id app.bornis.id pos.bornis.id kds.bornis.id display.bornis.id order.bornis.id admin.bornis.id;
  # ZKTeco ADMS machines often speak plain HTTP only and do not follow redirects: /iclock stays on port 80.
  location /iclock/ {
    proxy_pass http://borniz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;   # nginx 1.25+: may warn, still works (Ubuntu 22.04/24.04 ship older nginx)
  server_name bornis.id www.bornis.id app.bornis.id pos.bornis.id kds.bornis.id display.bornis.id order.bornis.id admin.bornis.id;
  ssl_certificate     /etc/letsencrypt/live/bornis.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bornis.id/privkey.pem;
  client_max_body_size 10m;

  location / {
    proxy_pass http://borniz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;                       # hosts.ts routes by it: keep it
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
# Merchant domains (CNAME → order.bornis.id): add them to server_name above, get their certificate,
# and list them in NEXT_PUBLIC_BORNIZ_CUSTOM_DOMAINS.
