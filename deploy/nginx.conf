# Every BorNiz host points at the same app (deploy/borniz.service on localhost:3000). deploy/setup-vps.sh installs it,
# with deploy/nginx-proxy.conf as /etc/nginx/snippets/borniz-proxy.conf. Replace bornis.id with NEXT_PUBLIC_BORNIZ_ROOT_DOMAIN.
# DNS: A records for bornis.id and *.bornis.id to this server. Certificate for bornis.id + *.bornis.id: the wildcard
# needs the DNS challenge (`npm run check:deploy` prints the command).
# localhost, like the service: it may be ::1 or 127.0.0.1, nginx tries both
upstream borniz { server localhost:3000; keepalive 32; }

# Port 80 for every name: ours, merchant domains (their certificate's HTTP challenge) and attendance machines set up
# with the bare IP. ZKTeco ADMS machines often speak plain HTTP only and do not follow redirects: /iclock stays here.
server {
  listen 80 default_server;
  server_name _;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location /iclock/ { include snippets/borniz-proxy.conf; }
  location / { return 301 https://$host$request_uri; }
}

# HTTPS for a name that is not ours (a bare IP, a forged Host): closed, never handed to the app.
server {
  listen 443 ssl default_server;
  ssl_certificate     /etc/letsencrypt/live/bornis.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bornis.id/privkey.pem;
  return 444;
}

server {
  listen 443 ssl http2;   # nginx 1.25+: may warn, still works (Ubuntu 22.04/24.04 ship older nginx)
  server_name bornis.id *.bornis.id;   # app., admin. and every business at <slug>.bornis.id
  ssl_certificate     /etc/letsencrypt/live/bornis.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bornis.id/privkey.pem;
  client_max_body_size 10m;
  location / { include snippets/borniz-proxy.conf; }
}

# Merchant domains (CNAME → menu.bornis.id), one file each, written by deploy/add-domain.sh with their own certificate.
include /etc/nginx/borniz-domains/*.conf;
