# Every BorNiz host points at the same app (deploy/borniz.service on localhost:3000). deploy/setup-vps.sh installs it..
# Replace bornis.id with NEXT_PUBLIC_BORNIZ_ROOT_DOMAIN. DNS: A records for bornis.id and *.bornis.id to this server.
# Certificate for bornis.id + *.bornis.id: the wildcard needs the DNS challenge (`npm run check:deploy` prints the command).
# localhost, like the service: it may be ::1 or 127.0.0.1, nginx tries both
upstream borniz { server localhost:3000; keepalive 32; }

server {
  listen 80;
  server_name bornis.id *.bornis.id;   # app., admin. and every business at <slug>.bornis.id
  # ZKTeco ADMS machines often speak plain HTTP only and do not follow redirects: /iclock stays on port 80.
  location /iclock/ {
    proxy_pass http://borniz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;   # nginx 1.25+: may warn, still works (Ubuntu 22.04/24.04 ship older nginx)
  server_name bornis.id *.bornis.id;   # app., admin. and every business at <slug>.bornis.id
  ssl_certificate     /etc/letsencrypt/live/bornis.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bornis.id/privkey.pem;
  client_max_body_size 10m;

  location / {
    proxy_pass http://borniz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;                       # hosts.ts routes by it: keep it
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
# Merchant domains (CNAME → menu.bornis.id): add a server block like the one above with their name and certificate,
# and list them in NEXT_PUBLIC_BORNIZ_CUSTOM_DOMAINS.
