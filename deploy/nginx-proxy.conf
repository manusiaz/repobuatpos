# How nginx hands a request to the app: included by every BorNiz host and every merchant domain, never copied.
proxy_pass http://borniz;
proxy_http_version 1.1;
proxy_set_header Host $host;                    # hosts.ts routes by it: keep it
proxy_set_header X-Forwarded-For $remote_addr;  # the client's own address, not one it claims (sign-in limits count it)
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
